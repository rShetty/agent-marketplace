# Hive production reverse proxy — PRODUCTION CUTOVER
#
# Per docs/MIGRATION_GOALS.md (Governance Hub) production cutover checklist:
# "Disable public UI routes in production reverse proxy; keep /api/* and
# /docs internal."
#
# The Hub (governance.rajeev.me) proxies Hive server-side over
# 127.0.0.1:8080, so no Hive route needs to be publicly reachable.
# The whole vhost is therefore restricted to the Tailscale tailnet
# (CGNAT range 100.64.0.0/10). Operators reach Hive UIs over tailnet only.

server {
    listen 80;
    server_name hive.rajeev.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hive.rajeev.me;

    ssl_certificate     /etc/letsencrypt/live/hive.rajeev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hive.rajeev.me/privkey.pem;

    # Internal-only: deny everything outside the tailnet.
    allow 100.64.0.0/10;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
